# @package _global_
algo:
  cls: speder_td3
  discount: 0.99
  tau: 0.005 # hard update
  actor_update_freq: 1
  target_update_freq: 1
  # critic_hidden_dims: [512, 512, 512] # this is actually not used
  actor_hidden_dims: [512, 512, 512]
  critic_lr: 0.0003
  actor_lr: 0.0003
  target_policy_noise: 0.2
  noise_clip: 0.3
  exploration_noise: 0.2

  # below are params specific to speder_td3
  feature_dim: 512
  feature_lr: 0.000005
  feature_tau: 0.01
  phi_hidden_dims: [512, 512]
  mu_hidden_dims: [512, 512]
  reward_coef: 1.0
  feature_update_ratio: 1
  critic_hidden_dims: [512, 512]
  reward_hidden_dims: [512, 512]
  back_critic_grad: false
  speder_coef: 1.0
  critic_coef: 1.0
  num_noises: 25
  lam: 1024

norm_obs: true
