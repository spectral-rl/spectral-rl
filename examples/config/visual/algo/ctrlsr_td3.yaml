# @package _global_

algo:
  cls: ctrlsr_td3

  tau: 0.01
  actor_hidden_dim: 1024
  actor_hidden_dims: [1024, 1024, ]
  critic_hidden_dim: 1024
  actor_lr: 0.0003
  critic_lr: 0.0003
  update_every: 2
  num_noises: 50
  feature_dim: 512
  embed_dim: 512
  rff_dim: 1024
  phi_hidden_dims: [512, 512]
  mu_hidden_dims: [512, 512]
  critic_hidden_dims: [1024, ]
  reward_hidden_dims: [1024, ]
  encoder_lr: 0.0001
  ctrl_lr: 0.0001
  ctrl_coef: 1.0
  reward_coef: 0.1
  critic_coef: 1.0
  extra_repr_step: 1
  back_critic_grad: false
  target_policy_noise: 0.2
  noise_clip: 0.3
  exploration_noise: 0.2
  reg_coef: 0.00001
  wd: 0.0001
  encoder_tau: 0.0005
  batch_size: ${batch_size}
